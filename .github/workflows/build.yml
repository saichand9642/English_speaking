name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Only one build per branch; a new push makes the previous one irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The NDK and this exact CMake are pinned in app/build.gradle.kts, so they
      # have to be installed explicitly rather than relying on the runner image.
      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.3.13750724" "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # whisper.cpp and llama.cpp are fetched by CMake at configure time and take
      # several minutes to compile. Caching them turns a 20 minute build into a
      # 5 minute one on every push after the first.
      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/native-deps
            app/.cxx
          key: native-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: |
            native-${{ runner.os }}-

      # ~31 MB, checksum-verified by the build, so a cache hit is always valid.
      - name: Cache bundled Whisper model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models
          key: whisper-model-${{ hashFiles('app/build.gradle.kts') }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: speak-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Signed release APK
    # Only on a version tag, and only if a keystore secret is configured.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.3.13750724" "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/native-deps
            app/.cxx
          key: native-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Check the keystore secret is present
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SPEAK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SPEAK_KEYSTORE_BASE64 is not set, so no signed APK will be produced. See docs/RELEASE_SIGNING.md."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Written outside the workspace so it can never be picked up by a build
      # step, committed, or swept into an artifact.
      - name: Decode the keystore
        if: steps.keystore.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SPEAK_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/speak-release.jks"

      - name: Build signed release APK
        if: steps.keystore.outputs.present == 'true'
        env:
          SPEAK_KEYSTORE_PASSWORD: ${{ secrets.SPEAK_KEYSTORE_PASSWORD }}
          SPEAK_KEY_ALIAS: ${{ secrets.SPEAK_KEY_ALIAS }}
          SPEAK_KEY_PASSWORD: ${{ secrets.SPEAK_KEY_PASSWORD }}
        run: |
          export SPEAK_KEYSTORE_PATH="$RUNNER_TEMP/speak-release.jks"
          ./gradlew assembleRelease --stacktrace

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/speak-release.jks"

      - name: Upload release APK
        if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: speak-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach the APK to the GitHub release
        if: steps.keystore.outputs.present == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
